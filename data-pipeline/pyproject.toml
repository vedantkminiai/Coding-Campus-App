[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc-etl"
version = "0.1.0"
description = "Waterloo CCC problems and commentary ETL pipeline"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.8,<3",
    "pypdf>=5,<7",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = ["extract*", "transform*", "load*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
